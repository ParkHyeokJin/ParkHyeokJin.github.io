<script src="{{ site.baseurl }}/js/vendor/jquery-3.7.1.min.js"></script>
<script src="{{ site.baseurl }}/js/bootstrap.min.js"></script>
{% if page.legacy %}
<!-- legacy theme plugins (home/work/project/contact only); they rely on APIs removed in jQuery 3 -->
<script src="{{ site.baseurl }}/js/vendor/jquery-migrate-3.5.2.min.js"></script>
<script src="{{ site.baseurl }}/js/owl.carousel.min.js"></script>
<script src="{{ site.baseurl }}/js/plugins.js"></script>
<script src="{{ site.baseurl }}/js/min/waypoints.min.js"></script>
<script src="{{ site.baseurl }}/js/jquery.counterup.js"></script>
<script src="{{ site.baseurl }}/js/main.js"></script>
{% endif %}
<script src="{{ site.baseurl }}/js/simple-jekyll-search.min.js"></script>
<script>
  SimpleJekyllSearch({
    searchInput: document.getElementById('search-input'),
    resultsContainer: document.getElementById('results-container'),
    json: '{{ site.baseurl }}/search.json',
    searchResultTemplate: '<li><a href="{url}">{title}</a></li>',
    noResultsText: 'No search Posts',
    limit: 10,
    fuzzy: false,
    exclude: ['Welcome']
  });
</script>
